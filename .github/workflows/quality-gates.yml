name: quality-gates

on:
  push:
    branches: [develop, "feature/**"]
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install (all optional platform packages)
        run: bun install --frozen-lockfile --os=* --cpu=*
      - name: Full check (architecture, types, build, tests, docs, zero-regression)
        run: bun run check
      - name: Quality gates
        run: bun scripts/quality-gates.mjs
      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ matrix.os }}
          path: reports/

  release-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        target:
          - linux-x64
          - linux-arm64
          - linux-x64-musl
          - linux-arm64-musl
          - linux-x64-baseline
          - linux-arm64-baseline
          - darwin-x64
          - darwin-arm64
          - darwin-x64-baseline
          - win32-x64
          - win32-arm64
          - win32-x64-baseline
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install (all optional platform packages)
        run: bun install --frozen-lockfile --os=* --cpu=*
      - name: Build ${{ matrix.target }}
        run: bun scripts/build-local.ts --target=${{ matrix.target }}
      - name: Verify artifacts and platform gates
        run: bun scripts/gate-platform.mjs
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeta-${{ matrix.target }}
          path: dist/local/${{ matrix.target }}/
